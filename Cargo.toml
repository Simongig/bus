[package]
name = "bus"
version = "0.1.0"
edition = "2021"
description = "Minimal terminal timeblocking: plan your day as stops on a route."

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
notify-rust = "4"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
lto = true
